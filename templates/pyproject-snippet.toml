# Copy this block into your repo's pyproject.toml to opt into release control.
# See docs/onboarding.md in EmergentMatter/actions for the full walkthrough,
# and templates/CONTRIBUTING.md for the contributor-facing half.

# ── towncrier: turns changelog.d/ notes into CHANGELOG.md ─────────────────
#
# Exactly three fragment types, matching the three bump levels the release
# workflow understands (see EmergentMatter/actions CONTRACT.md). Do not add
# a fourth type — compute_bump.py only recognizes major/minor/patch and
# exits 1 on anything else.
[tool.towncrier]
directory = "changelog.d"          # where `uv run scripts/changeset.py` writes notes
filename = "CHANGELOG.md"
# Insert this marker into CHANGELOG.md once, above your existing history.
# towncrier writes new release sections directly below it and never touches
# anything beneath — see docs/onboarding.md for inserting it into a
# hand-written changelog without disturbing prior entries.
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
underlines = ["-", "~", "^"]

[[tool.towncrier.type]]
directory = "major"
name = "Major"
showcontent = true

[[tool.towncrier.type]]
directory = "minor"
name = "Minor"
showcontent = true

[[tool.towncrier.type]]
directory = "patch"
name = "Patch"
showcontent = true

# ── em-release: tells sync_version.py every place the version string lives ──
#
# One entry per "path:symbol" location, beyond `[project] version` itself
# (that one is handled separately, by `uv version --bump` in the release
# workflow — do not list it here).
#
# Every location you list gets written on every release. Anything you don't
# list is never touched — that's deliberate, so a data/schema version that
# is meant to move independently of the package version is safe just by
# being left off this list. See docs/onboarding.md for the
# emergent-matter-materials worked example, where __catalog_version__ *is*
# listed because it's meant to track the package version in lockstep.
[tool.em-release]
version_files = [
  "src/<package_name>/__init__.py:__version__",
]

# ── mypy: the typing half of STYLE.md's "Typing" section ──────────────────
#
# Strict-ish on structural code; relax per-module for JAX kernels or
# bpy-bound code with an explicit, commented override below -- never with a
# blanket project-wide relaxation. mypy has no config-inheritance mechanism
# the way ruff does, so this block is copy-pasted at onboarding rather than
# synced; fleet_status.py's `tooling` check only confirms it exists, not
# that it matches byte-for-byte.
[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Uncomment and adjust for scientific-stack modules that can't be
# meaningfully typed (JAX kernels, bpy-bound Blender code):
# [[tool.mypy.overrides]]
# module = ["<package_name>.sdf_shapes", "<package_name>.sdf_ops"]
# disallow_untyped_defs = false

# jax/pyvista/trimesh/skimage/bpy commonly ship no type stubs. List only
# the ones this repo actually imports -- an unused entry here hides a
# real missing-stub finding for a dependency that DOES ship them.
# [[tool.mypy.overrides]]
# module = ["jax.*", "bpy"]
# ignore_missing_imports = true

# ── pytest: the shared suite config from STYLE.md's "Testing" section ─────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Turns every warning into a failure, per STYLE.md. A per-repo exception is
# an explicit entry here (e.g. "ignore::DeprecationWarning:some_dep"), not
# a silent suppression.
filterwarnings = ["error"]

# ── dev dependency group additions for the above ───────────────────────────
#
# Add these to this repo's existing [dependency-groups] dev = [...] list:
#   "pytest>=8.0",
#   "ruff>=0.16",
#   "mypy>=1.14",
