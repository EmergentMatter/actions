# Starting CI template for a consuming repo — copy to
# `.github/workflows/ci.yml` and adjust as the repo needs.
#
# Most repos in the org currently run no automated checks at all; this is
# the floor every repo gets on day one, not the ceiling. Three stages,
# consistent names across every repo that copies this (C4), so "the lint
# job" and "the build job" mean the same thing everywhere:
#
#   lint  - advisory during rollout; see the staged-rollout note on the
#           lint job below. Turning a linter on across an established
#           codebase produces a pile of findings unrelated to whatever PR
#           happens to trip the check first, and a check people learn to
#           click past is worse than no check. Clear the backlog in its own
#           dedicated PR before enforcing. Don't skip straight to blocking.
#   test  - runs the repo's test suite. If there isn't one yet, it still
#           runs (and passes) rather than being skipped outright — see the
#           "no tests" branch below. The floor is never zero (C5).
#   build - `uv build`, then install the built wheel into a clean
#           environment and import it, then keep the artifacts. A green
#           test suite only proves the source tree works; tests run
#           against source, but users install the built package, so a
#           repo can be fully green on tests and still be broken to
#           install. This stage is what actually catches that (C2) --
#           and it takes the verify step to do it, because `uv build`
#           alone reports success for a wheel containing nothing.
#
# `uv sync --locked` in every job fails if uv.lock is out of date, so this
# always runs on a clean, from-lockfile install rather than trusting
# whatever's already resolved on a developer's machine (C3).
#
# Must stay callable both directly on pull_request AND as a reusable
# workflow_call — the version.yml stub does `needs: ci` onto this file by
# reference (`uses: ./.github/workflows/ci.yml`).
#
# `name: CI` below is what makes checks display as `CI / lint` etc.
# instead of falling back to the file path (`.github/workflows/ci.yml /
# lint`). Safe to add: required-status-check contexts are job names
# (`lint`, `test`, `build`), not the workflow name, so this doesn't touch
# branch protection.

name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # STAGED ROLLOUT. `continue-on-error` does NOT make lint non-blocking
    # on pull requests, and believing otherwise gets the rollout backwards.
    # Verified on a real run, not assumed:
    #
    #   job conclusion .................. failure
    #   workflow RUN conclusion ......... success  <- all this line changes
    #   CHECK RUN conclusion ............ failure  <- branch protection sees this
    #
    # So a failing lint job still reports a failed check and still blocks a
    # PR the moment `lint` is a required status check. What this line
    # actually buys is that a lint failure doesn't fail the whole run, so
    # it doesn't take down `version.yml`'s `needs: ci` and stall a release
    # while the backlog is still being cleared.
    #
    # Whether lint blocks PRs is controlled by ONE thing: whether `lint` is
    # in the repo's required status checks. The two levers move together:
    #
    #   Phase 1  keep this line, and leave `lint` OUT of required contexts
    #            -> advisory everywhere, visible to anyone who looks
    #   Phase 2  clear the existing findings in a dedicated lint-only PR
    #   Phase 3  delete this line AND add `lint` to required contexts
    #            -> enforced on PRs and on the release path
    #
    # Deleting this line without adding the context leaves lint unenforced
    # on PRs while newly able to stall a release — the worst of both.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          # Distinct per job: lint/test/build all cache the same
          # dependency set and, run concurrently, raced the same
          # setup-uv-2-... cache key ("Failed to save: Unable to reserve
          # cache") without this.
          cache-suffix: lint

      - run: uv sync --locked

      - run: uv run ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          cache-suffix: test

      # Install must be the step immediately before the test run, with
      # nothing that writes a version string in between. Some repos have
      # tests that read INSTALLED package metadata (importlib.metadata),
      # not the source tree — e.g. emergent-matter-materials asserts
      # importlib.metadata.version() agrees with the module's __version__.
      # A fresh sync right before the test step, on every run, makes that
      # class of "environment vs. tree" drift structurally impossible —
      # it's a concrete instance of why C3 requires a clean-machine,
      # from-lockfile install rather than a persisted/cached environment.
      # If you add a step here later, keep it above this line, not between
      # sync and test.
      - run: uv sync --locked

      - name: Run tests
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "No tests/ directory yet — nothing to run. (install + build still ran below.)"
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          cache-suffix: build

      - run: uv sync --locked

      - run: uv build

      # `uv build` exiting 0 does NOT mean the wheel is usable. Verified
      # against hatchling: a wheel target naming a package directory that
      # doesn't exist, and `exclude = ["*"]`, both build "successfully" and
      # produce an artifact with nothing importable in it. Without this step
      # the build stage only catches builds that fail outright, which is a
      # weaker claim than the one at the top of this file.
      #
      # This installs the wheel into a clean environment, from outside the
      # checkout, and imports what it declares. Referenced rather than
      # inlined so a fix reaches every repo when `v1` moves -- unlike this
      # file, which is a copy.
      - uses: EmergentMatter/actions/verify-wheel@v1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          retention-days: 14
          if-no-files-found: error
