# ruff.toml -- seed-once: written at onboarding if absent, then yours.
# Nothing in the actions repo ever touches this file again. Local rule
# additions and overrides go here, never in ruff-base.toml.

extend = "ruff-base.toml"

# Examples of the kind of per-repo addition that belongs here:
#
# [lint.per-file-ignores]
# "src/pkg/catalog/*.py" = ["E501"]   # hand-aligned data literals
#
# A repo on the Python 3.11 floor (see STYLE.md's "Python version policy")
# overrides the base's target-version here:
#
# target-version = "py311"
