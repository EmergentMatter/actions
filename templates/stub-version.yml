# .github/workflows/version.yml
name: Version
on:
  push:
    branches: [main]
jobs:
  ci:
    uses: ./.github/workflows/ci.yml      # the repo's OWN checks (C4)
    # `secrets: inherit` belongs HERE, and only if your own ci.yml needs a repo
    # secret. A local reusable-workflow call does not inherit secrets implicitly
    # either. Real example: sdm-core's CI fetches the private sibling
    # emergent-matter-materials with MATERIALS_REPO_TOKEN, so its ci job needs it.
    # A repo whose CI needs no secrets should omit this line.
    secrets: inherit
  version:
    needs: ci
    uses: EmergentMatter/actions/.github/workflows/version.yml@v1
    with:
      # MUST match the @ref above -- see stub-changelog-check.yml for why.
      actions-ref: v1

      # ── Private sibling checkout: DELETE unless your pyproject.toml has a
      # `[tool.uv.sources]` entry pointing at a local path. The bump step in
      # the shared workflow runs `uv version --bump` and `uv lock`, which
      # resolve that path source and fail hard when it isn't on disk -- and
      # your CI stays GREEN while it happens, so the miss shows up only as a
      # release that never gets cut. sibling-ref must be a pinned SHA; see
      # docs/onboarding.md, "A private sibling your package depends on".
      # sibling-repo: EmergentMatter/emergent-matter-materials
      # sibling-ref: <SHA -- pinned, matching the one your ci.yml uses>
      # sibling-path: emergent-matter-materials
    permissions: { contents: write, pull-requests: write }

    # ── DELETE alongside the sibling-* inputs above if you aren't using them.
    # secrets:
    #   sibling-token: ${{ secrets.MATERIALS_REPO_TOKEN }}

    # NO `secrets: inherit` here, deliberately. The shared workflows read
    # exactly ONE optional secret between them -- version.yml's
    # `sibling-token`, above -- and it is mapped BY NAME when a repo needs it.
    # Everything else uses the auto-injected `github.token`. Granting org
    # secrets to a workflow hosted in a public repo and pinned by a movable
    # `v1` tag would make that tag equivalent to secret access across every
    # consuming repo. Map the one secret you need; never inherit the store.
