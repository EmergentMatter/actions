# .github/workflows/version.yml
name: Version
on:
  push:
    branches: [main]
jobs:
  ci:
    uses: ./.github/workflows/ci.yml      # the repo's OWN checks (C4)
    # `secrets: inherit` belongs HERE, and only if your own ci.yml needs a repo
    # secret. A local reusable-workflow call does not inherit secrets implicitly
    # either. Real example: sdm-core's CI fetches the private sibling
    # emergent-matter-materials with MATERIALS_REPO_TOKEN, so its ci job needs it.
    # A repo whose CI needs no secrets should omit this line.
    secrets: inherit
  version:
    needs: ci
    uses: EmergentMatter/actions/.github/workflows/version.yml@v1
    with:
      # MUST match the @ref above -- see stub-changelog-check.yml for why.
      actions-ref: v1

      # ── Private sibling checkout: DELETE unless your pyproject.toml has a
      # `[tool.uv.sources]` entry pointing at a local path. Without it the
      # bump step fails on that path source -- and CI stays GREEN while it
      # happens, so the miss shows up only as a release that never gets cut.
      # Pin sibling-ref to a SHA. See docs/onboarding.md, "A private sibling
      # your package depends on".
      # sibling-repo: EmergentMatter/emergent-matter-materials
      # sibling-ref: <SHA -- pinned, matching the one your ci.yml uses>
      # sibling-path: emergent-matter-materials

      # ── Second (nested) private sibling: DELETE unless sibling-repo
      # ABOVE itself pins a private path dependency (consumer -> sibling ->
      # sibling2). Requires sibling-repo to also be set -- if you uncomment
      # this block, sibling-repo above names your DIRECT dependency, not
      # necessarily emergent-matter-materials. Real example:
      # emergent-matter-web-sdm-tool -> emergent-matter-sdm-core ->
      # emergent-matter-materials, i.e. sibling-repo would be sdm-core and
      # sibling2-repo would be materials. See docs/onboarding.md, "A second,
      # nested sibling".
      # sibling2-repo: EmergentMatter/emergent-matter-materials
      # sibling2-ref: <SHA -- pinned, matching sibling-repo's own ci.yml>
      # sibling2-path: emergent-matter-materials
    permissions: { contents: write, pull-requests: write }

    # ── DELETE alongside the sibling-* inputs above if you aren't using them.
    # If you uncommented the nested block, sibling-token also names a
    # DIFFERENT secret than the single-hop default below -- one per repo,
    # matching whatever you set sibling-repo / sibling2-repo to.
    # secrets:
    #   sibling-token: ${{ secrets.MATERIALS_REPO_TOKEN }}
    #   sibling2-token: ${{ secrets.MATERIALS_REPO_TOKEN }}  # only with the nested block above

    # NO `secrets: inherit` here, deliberately. `sibling-token` above is the
    # only secret the shared workflows read, and it is mapped BY NAME;
    # everything else uses the auto-injected `github.token`. Inheriting would
    # hand a public repo behind a movable `v1` tag your whole org secret
    # store. Map the one secret you need; never inherit.
