# .github/workflows/build-release.yml
#
# NOT part of the automated release path. version.yml builds and creates
# the GitHub Release itself, inline, the moment it pushes the release tag,
# because the tag it pushes cannot trigger a workflow. For why, see "Why
# the release is not tag-triggered" in
# https://github.com/EmergentMatter/actions/blob/main/CONTRACT.md
#
# This stub covers the paths that are not automated: a human pushing a
# `v*` tag by hand (which DOES trigger workflows), and
# `workflow_dispatch` for manually rebuilding or republishing a past
# release (e.g. after a failed publish).
name: Build & Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  release:
    uses: EmergentMatter/actions/.github/workflows/build-release.yml@v1
    permissions:
      contents: write
      id-token: write
    # No `secrets: inherit` -- build-release.yml never reads secrets.*;
    # publishing uses OIDC trusted publishing (id-token: write above), not
    # a token. Add it back only if this repo's own copy grows a step that
    # genuinely needs a named secret.
    with:
      # Opt-in, off by default (S3). Flip to true (and set `environment:`
      # to a GitHub Environment wired to a PyPI trusted publisher) once
      # this repo is ready to publish releases to an index.
      publish: false
