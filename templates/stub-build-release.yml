# .github/workflows/build-release.yml
#
# CONTRACT.md's "Consumer stub" section only spells out the version.yml
# stub's exact shape; this one and stub-changelog-check.yml are this
# repo's own design, per CLAUDE.md's "Known Issues" note.
#
# NOT part of the automated release path. version.yml builds and creates
# the GitHub Release itself, inline, the moment it pushes the release tag.
# A tag pushed with GITHUB_TOKEN doesn't trigger further workflow runs,
# so a stub listening for that push would never fire (found by the
# em-release-control-test rehearsal). This stub stays for two cases that
# aren't the automated path: a human pushing a `v*` tag by hand (which
# DOES trigger workflows), and `workflow_dispatch` for manually rebuilding
# or republishing a past release (e.g. after a failed publish).
name: Build & Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  release:
    uses: EmergentMatter/actions/.github/workflows/build-release.yml@v1
    permissions:
      contents: write
      id-token: write
    # No `secrets: inherit` -- build-release.yml never reads secrets.*;
    # publishing uses OIDC trusted publishing (id-token: write above), not
    # a token. Add it back only if this repo's own copy grows a step that
    # genuinely needs a named secret.
    with:
      # Opt-in, off by default (S3). Flip to true (and set `environment:`
      # to a GitHub Environment wired to a PyPI trusted publisher) once
      # this repo is ready to publish releases to an index.
      publish: false
