# .github/workflows/changelog-check.yml
name: Changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  changelog:
    runs-on: ubuntu-latest
    # Required: changelog-check is a composite action and cannot declare
    # its own permissions.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: EmergentMatter/actions/changelog-check@v1
