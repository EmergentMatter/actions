# The single declaration of what onboarding installs and what sync.py keeps
# current. Consumed by onboard.py, sync.py, and fleet_status.py -- read with
# stdlib tomllib. Do not change this shape without updating each of them.
#
#   source  path relative to templates/ (may be nested, e.g. ISSUE_TEMPLATE/x)
#   dest    path relative to the target repo root
#   policy  "managed"    -- must always match the template. Divergence is
#                            either staleness or a local edit; sync.py tells
#                            the two apart with a three-way compare and
#                            resolves or reports accordingly.
#           "seed-once"  -- written once, at onboarding, if absent. Never
#                            touched again, by onboard.py or sync.py.
#   tier    optional. Absent (the common case) means the entry applies to
#           every repo regardless of licence tier. "open" or "closed" scopes
#           the entry to repos declaring that `[tool.em-release] tier` in
#           their own pyproject.toml (see docs/onboarding.md, "Licence
#           tier"). LICENSE and NOTICE are the only entries that currently
#           use it: two entries per dest, one per tier, so the SAME dest can
#           resolve to different source content depending on the target
#           repo. A repo with no declared tier gets NEITHER entry for that
#           dest -- see onboard.py's entries_for_tier() and sync.py's
#           handling of a missing tier.

[[template]]
source = "scripts/em-dev.py"
dest   = "scripts/em-dev.py"
policy = "managed"

[[template]]
source = "scripts/em-dev.cmd"
dest   = "scripts/em-dev.cmd"
policy = "managed"

