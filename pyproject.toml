# This repo hosts the org's reusable release workflows and releases itself
# with them: changelog.d/ notes, a release PR, and a v1.x.y point tag when it
# merges. Consumers pin the moving `v1` tag, which is moved by hand. It is not
# onboarded into template sync (no [tool.em-release]). See .github/RELEASING.md.
#
# No [build-system] on purpose: uv treats this as a virtual project, so
# `uv sync` installs the dev tooling without trying to build a package.

[project]
name = "emergent-matter-actions"
version = "1.15.1"
description = "Reusable GitHub Actions workflows for versioning and releasing EmergentMatter Python repos"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]

[tool.ruff.format]

# This repo ships scripts/, not a src/ package (see the header comment
# above: no [build-system], it's a virtual project) -- so it's the one
# place in the org where `mypy scripts` is the right invocation, not the
# `mypy src` that STYLE.md/templates/ci.yml's typecheck job runs for a
# consuming repo's own src-layout package.
[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Same shape as templates/pyproject-snippet.toml: one fragment type per bump
# level compute_bump.py understands.
[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
underlines = ["-", "~", "^"]

[[tool.towncrier.type]]
directory = "major"
name = "Major"
showcontent = true

[[tool.towncrier.type]]
directory = "minor"
name = "Minor"
showcontent = true

[[tool.towncrier.type]]
directory = "patch"
name = "Patch"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "integration: builds a real uv venv against a local test index (slow; deselect with -m 'not integration')",
]
