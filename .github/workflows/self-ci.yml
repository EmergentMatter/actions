name: Self CI

# This repo's own checks — not reusable, not workflow_call. Ruff + pytest
# over scripts/ and tests/, matching CLAUDE.md's documented "Build & Run"
# commands exactly (uv sync / uv run ruff check . / uv run pytest) so local
# reproduction is identical to CI. Ruleset and line-length live in this
# repo's own pyproject.toml [tool.ruff] — not duplicated here as CLI flags.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          # Distinct per job: lint and test run concurrently and raced the
          # same setup-uv-2-... cache key ("Failed to save: Unable to
          # reserve cache") without this.
          cache-suffix: lint

      - name: uv sync
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: Scope block parity (templates/SECURITY.md / templates/SUPPORT.md)
        # These two files state the same security/support scope in nearly
        # identical documents, and nothing else enforces that they agree.
        # Ported from the retired EmergentMatter/.github repo's
        # .github/scripts/validate.py, which proved this check catches a
        # one-character edit -- only its scope-block assertion belongs here;
        # its other checks (license text, issue-form schema, actionlint,
        # URL resolution) were specific to that repo's own inheritance model
        # and don't apply to templates/ being copied into consuming repos.
        run: |
          uv run python - <<'EOF'
          import difflib
          import sys
          from pathlib import Path

          def extract_scope_block(path: Path) -> str | None:
              """Text from the `## Scope` heading (inclusive) up to the next
              `## ` heading (exclusive), or end of file. None if no `## Scope`
              heading is present."""
              lines = path.read_text().splitlines(keepends=True)
              start = next(
                  (i for i, line in enumerate(lines) if line.rstrip("\r\n") == "## Scope"),
                  None,
              )
              if start is None:
                  return None
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  if lines[i].startswith("## "):
                      end = i
                      break
              return "".join(lines[start:end])

          security_path = Path("templates/SECURITY.md")
          support_path = Path("templates/SUPPORT.md")

          for path in (security_path, support_path):
              if not path.exists():
                  print(f"::error::{path} does not exist")
                  sys.exit(1)

          security_block = extract_scope_block(security_path)
          support_block = extract_scope_block(support_path)

          if security_block is None:
              print(f"::error::{security_path} has no '## Scope' heading")
              sys.exit(1)
          if support_block is None:
              print(f"::error::{support_path} has no '## Scope' heading")
              sys.exit(1)

          if security_block != support_block:
              diff = "\n".join(
                  difflib.unified_diff(
                      support_block.splitlines(),
                      security_block.splitlines(),
                      fromfile=str(support_path),
                      tofile=str(security_path),
                      lineterm="",
                  )
              )
              print(
                  "::error::templates/SECURITY.md and templates/SUPPORT.md disagree on "
                  "the '## Scope' block. These must say the same thing, byte-for-byte -- "
                  "copy the block from one file into the other verbatim (the '## Scope' "
                  "heading through the line before the next '## ' heading) and re-run.\n"
                  + diff
              )
              sys.exit(1)

          print("OK  templates/SECURITY.md and templates/SUPPORT.md agree on '## Scope'")
          EOF

      - name: This repo's own health files match templates/
        # actions carries its own copies of the health files it ships, because
        # it is the repo the org's security policy points at and it needs a
        # policy of its own. But it is deliberately NOT onboarded into release
        # control, so it has no `templates_version` stamp and sync.py cannot
        # reach it -- nothing would notice these copies going stale. This is
        # the same drift the rest of this PR exists to catch, so it gets the
        # same treatment: the copies must be byte-identical to their source.
        #
        # Only files that genuinely apply here are copied. NOTICE is an
        # Apache-2.0 artifact and this repo is MIT; the issue forms require a
        # `pip show` package version and this repo ships no package; and
        # .github/CODEOWNERS is richer here than the template. Those three are
        # deliberately absent, not forgotten.
        run: |
          uv run python - <<'EOF'
          import sys
          from pathlib import Path

          COPIES = {
              "SECURITY.md": "templates/SECURITY.md",
              "SUPPORT.md": "templates/SUPPORT.md",
              "CODE_OF_CONDUCT.md": "templates/CODE_OF_CONDUCT.md",
              ".github/PULL_REQUEST_TEMPLATE.md": "templates/PULL_REQUEST_TEMPLATE.md",
          }

          failed = False
          for local, template in COPIES.items():
              local_path, template_path = Path(local), Path(template)
              for p in (local_path, template_path):
                  if not p.is_file():
                      print(f"::error::{p} is missing; expected {local} to be a copy of {template}")
                      failed = True
              if failed:
                  continue
              if local_path.read_bytes() != template_path.read_bytes():
                  print(
                      f"::error::{local} has drifted from {template}. This repo's own copy "
                      f"must stay byte-identical to the template it ships -- sync.py cannot "
                      f"reach this repo, so nothing else would catch it. Copy {template} "
                      f"over {local} and re-run."
                  )
                  failed = True

          if failed:
              sys.exit(1)

          print(f"OK  {len(COPIES)} local health file(s) match templates/")
          EOF

      - name: Issue forms parse and carry the keys GitHub requires
        # A malformed issue form fails silently on GitHub's side: the form
        # just does not appear in the new-issue chooser, with no error shown
        # anywhere. Nothing else here would catch that, and these files are
        # copied into every repo in the org.
        #
        # Ported from the retired EmergentMatter/.github repo's validate.py,
        # which checked this before that repo was consolidated into this one.
        # It only renders from a default branch, so CI is the only place this
        # gets checked before a repo receives it.
        run: |
          uv run --with pyyaml python - <<'EOF'
          import sys
          from pathlib import Path

          import yaml

          FORMS_DIR = Path("templates/ISSUE_TEMPLATE")
          REQUIRED_FORM_KEYS = ("name", "description", "body")

          failed = False

          def fail(msg: str) -> None:
              global failed
              print(f"::error::{msg}")
              failed = True

          if not FORMS_DIR.is_dir():
              fail(f"{FORMS_DIR} does not exist; the shared issue forms are missing")
              sys.exit(1)

          form_files = sorted(p for p in FORMS_DIR.iterdir() if p.suffix in (".yml", ".yaml"))
          if not form_files:
              fail(f"no .yml files in {FORMS_DIR}")
              sys.exit(1)

          for path in form_files:
              try:
                  data = yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  fail(f"{path} is not valid YAML:\n{exc}")
                  continue

              if not isinstance(data, dict):
                  fail(f"{path} must parse to a YAML mapping, got {type(data).__name__}")
                  continue

              if path.name == "config.yml":
                  # Not an issue form. It configures the chooser page, so it
                  # has its own shape: contact_links each need a name, an
                  # http(s) url, and the `about` line shown under the name.
                  for i, link in enumerate(data.get("contact_links") or []):
                      if not isinstance(link, dict):
                          fail(f"{path} contact_links[{i}] must be a mapping")
                          continue
                      for key in ("name", "url", "about"):
                          if not link.get(key):
                              fail(f"{path} contact_links[{i}] has no '{key}'")
                      url = str(link.get("url", ""))
                      if url and not url.startswith(("http://", "https://")):
                          fail(f"{path} contact_links[{i}] url is not http(s): {url}")
                  continue

              missing = [k for k in REQUIRED_FORM_KEYS if k not in data]
              if missing:
                  fail(f"{path} is missing required issue-form key(s): {', '.join(missing)}")

          if failed:
              sys.exit(1)

          print(f"OK  {len(form_files)} issue-template file(s) valid")
          EOF

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          cache-suffix: test

      - name: uv sync
        run: uv sync --locked

      - name: pytest
        run: uv run pytest
