name: Changelog check

# DEPRECATED — this reusable `workflow_call` workflow is kept ONLY so any
# consumer stub still pinned to
# `uses: EmergentMatter/actions/.github/workflows/changelog-check.yml@v1`
# keeps working once `v1` moves onto a commit where the check has been
# rewritten as a composite action. It forwards to that composite action
# below and does nothing else. New stubs should call the action directly
# instead — see templates/stub-changelog-check.yml:
#
#   uses: EmergentMatter/actions/changelog-check@v1
#
# The real logic lives in changelog-check/action.yml now. Reasons for the
# move: a composite action's own repo is checked out for it (github.
# action_path resolves it automatically), which deletes the actions-ref /
# job.workflow_sha-fallback indirection this file used to need to reach
# scripts/compute_bump.py, and it shortens the check name: displayed
# `Changelog / changelog / Require a changelog note` (context
# `changelog / Require a changelog note`) becomes displayed
# `Changelog / changelog` (context `changelog`). Callers still on THIS
# shim keep the longer pair — see docs/onboarding.md.
#
# Keeping this shim alive is what makes the change backwards-compatible —
# see .github/RELEASING.md: a change that broke every existing stub's
# `uses:` path would require a `v2`. This one doesn't, because of this file.

on:
  workflow_call:
    inputs:
      actions-ref:
        description: >-
          DEPRECATED — accepted but ignored. Existed so the old
          implementation could locate EmergentMatter/actions's scripts/ at
          a specific ref; the composite action this now forwards to
          doesn't need that. Kept only so stubs still passing this input
          (with: { actions-ref: v1 }) don't fail to parse against this
          workflow's inputs schema.
        type: string
        default: v1
      notes-dir:
        description: Directory containing pending changelog note fragments.
        type: string
        default: changelog.d
      skip-label:
        description: PR label that exempts this check.
        type: string
        default: skip-changelog
      bot-actors:
        description: Comma-separated GitHub actors exempt from the note requirement.
        type: string
        default: "dependabot[bot],github-actions[bot]"
      python-version:
        description: Python version used to run compute_bump.py's grammar validation.
        type: string
        default: "3.13"

permissions: {}

jobs:
  check:
    name: Require a changelog note
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Hardcoded @v1, and it has to be: `uses:` cannot take a templated
      # ref, so this cannot be driven off inputs.actions-ref, nor off
      # whatever ref the caller actually pinned. Two consequences, stated
      # plainly rather than glossed:
      #
      #  - Caller pinned @v1 (the documented, overwhelmingly common case):
      #    shim and composite action resolve to the same commit. Correct.
      #  - Caller pinned a POINT tag (@v1.1.0): the shim is frozen at that
      #    commit, but the action below still floats with `v1`. After a
      #    later release those are different commits. That is real version
      #    skew, and it is ACCEPTED here rather than solved -- this path is
      #    deprecated, the fix is to stop using it and call the composite
      #    action directly, and no ref expression exists that would let a
      #    reusable workflow forward its own resolved ref into a `uses:`.
      #
      # Do not "fix" this with ${{ inputs.actions-ref }}: it will not
      # evaluate, and a stub that appears to pin is worse than one that
      # visibly does not.
      - name: Changelog check (forwards to the composite action)
        uses: EmergentMatter/actions/changelog-check@v1
        with:
          notes-dir: ${{ inputs.notes-dir }}
          skip-label: ${{ inputs.skip-label }}
          bot-actors: ${{ inputs.bot-actors }}
          python-version: ${{ inputs.python-version }}
