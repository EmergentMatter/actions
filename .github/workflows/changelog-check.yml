name: Changelog check

# Reusable workflow_call workflow — see CONTRACT.md "Workflow workflow_call inputs".
#
# Fails a PR that doesn't add a changelog.d/ note, unless the PR carries
# `skip-label` or was opened by one of `bot-actors`. The release PR itself
# is exempt through the same skip-label mechanism (E6): version.yml applies
# `skip-changelog` to it at creation, and it's also opened by
# `github-actions[bot]`, which is covered by the default bot-actors list —
# two independent exemptions land on the same PR.
#
# Enforcement is NOT delegated to scientific-python/action-towncrier-changelog
# as the sole gate: that action reads its config (enabled/skip-label) from a
# `[tool.<BOT_USERNAME>.towncrier_changelog]` section in the CONSUMER's
# pyproject.toml, which `templates/pyproject-snippet.toml` does not declare —
# so relying on it alone would silently no-op (its script exits 0 when that
# section is missing or `enabled` is unset). The real gate below is native to
# this workflow's inputs; the wrapped action runs as a best-effort secondary
# check.

on:
  workflow_call:
    inputs:
      actions-ref:
        description: >-
          Ref of EmergentMatter/actions to load scripts/ from. MUST match the
          @ref this workflow is pinned to in your stub. There is no context
          field giving a reusable workflow its own ref (github.job_workflow_sha
          resolves to empty -- verified, not assumed), and an empty checkout ref
          silently means "the default branch", so this is passed explicitly
          rather than derived.
        type: string
        default: v1
      notes-dir:
        description: Directory containing pending changelog note fragments.
        type: string
        default: changelog.d
      skip-label:
        description: PR label that exempts this check.
        type: string
        default: skip-changelog
      bot-actors:
        description: Comma-separated GitHub actors exempt from the note requirement.
        type: string
        default: "dependabot[bot],github-actions[bot]"
      python-version:
        description: Python version used to run compute_bump.py's grammar validation.
        type: string
        default: "3.13"

permissions: {}

jobs:
  check:
    name: Require a changelog note
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Determine exemption
        id: exempt
        env:
          ACTOR: ${{ github.actor }}
          BOT_ACTORS: ${{ inputs.bot-actors }}
          SKIP_LABEL: ${{ inputs.skip-label }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          is_exempt=false
          reason=""
          # Exact-segment match against the comma-separated bot-actors list —
          # wrap both sides in delimiters so "bot" doesn't substring-match "robot".
          if [[ ",${BOT_ACTORS}," == *",${ACTOR},"* ]]; then
            is_exempt=true
            reason="actor '${ACTOR}' is in bot-actors"
          elif [[ ",${LABELS}," == *",${SKIP_LABEL},"* ]]; then
            is_exempt=true
            reason="PR carries the '${SKIP_LABEL}' label"
          fi
          echo "is-exempt=${is_exempt}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.exempt.outputs.is-exempt == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the PR head commit, not the default refs/pull/N/merge.
          # This job validates the notes THIS PR adds, not a hypothetical
          # merge result — and the merge ref is computed lazily by GitHub,
          # so checking it out immediately after the PR event can race
          # actions/checkout's retries and fail with "couldn't find remote
          # ref" even though the PR is perfectly mergeable. The head sha
          # always exists the instant the PR does.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: List files added by this PR
        if: steps.exempt.outputs.is-exempt == 'false'
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NOTES_DIR: ${{ inputs.notes-dir }}
        run: |
          set -euo pipefail
          mapfile -t added < <(
            gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
              -q '.[] | select(.status == "added") | .filename'
          )
          # Only asks "did this PR add anything under notes-dir/ at all?" —
          # deliberately NOT matching the *.major.md|minor.md|patch.md
          # grammar here. A note with a typo'd level (e.g. `+abcd.banana.md`)
          # must still pass this gate, so the failure surfaces as
          # compute_bump.py's "unrecognized bump level" a few steps down —
          # the script that owns that grammar — rather than this step's
          # generic "no note was added," which would send a contributor who
          # DID add a note looking for the wrong problem.
          matches=()
          for f in "${added[@]}"; do
            case "$f" in
              "${NOTES_DIR}"/*.md)
                matches+=("$f")
                ;;
            esac
          done
          if [ "${#matches[@]}" -eq 0 ]; then
            {
              echo "::error::No changelog note was added under '${NOTES_DIR}/' by this PR."
              echo "Run 'uv run changeset' and commit the file it writes, or apply the"
              echo "'${{ inputs.skip-label }}' label if this change genuinely needs no note."
            } >&2
            exit 1
          fi
          printf 'Note(s) added by this PR:\n%s\n' "$(printf '%s\n' "${matches[@]}")"

      - name: Validate the shared-workflow ref
        # An empty checkout ref silently means "the default branch", so an
        # unresolvable ref does not fail -- it quietly runs main while the
        # consumer believes it pinned @v1. Fail loudly instead.
        #
        # Two derivations were tried and both resolve to empty or wrong:
        # github.workflow_ref is the CALLER's ref (asked our repo for the
        # consumer's refs/pull/N/merge), and github.job_workflow_sha is empty
        # in practice. Both were caught by the em-release-control-test
        # rehearsal, the second only because this assertion existed. Hence the
        # explicit actions-ref input.
        if: steps.exempt.outputs.is-exempt == 'false'
        id: shared
        env:
          REF: ${{ inputs.actions-ref }}
        run: |
          set -euo pipefail
          if [[ -z "${REF:-}" ]]; then
            echo "::error::actions-ref is empty. An empty checkout ref silently means"
            echo "the default branch, which would ignore the @ref you pinned."
            exit 1
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout EmergentMatter/actions scripts
        if: steps.exempt.outputs.is-exempt == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmergentMatter/actions
          ref: ${{ steps.shared.outputs.ref }}
          path: ${{ runner.temp }}/em-actions

      - name: Set up Python
        if: steps.exempt.outputs.is-exempt == 'false'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Validate note grammar (compute_bump.py)
        if: steps.exempt.outputs.is-exempt == 'false'
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/em-actions/scripts/compute_bump.py" \
            --notes-dir "${{ inputs.notes-dir }}" \
            --format json

      - name: Validate note naming via towncrier (best-effort)
        # Secondary check only. Requires the consuming repo's pyproject.toml
        # to declare [tool.em-release-bot.towncrier_changelog] with
        # enabled = true, which templates/pyproject-snippet.toml does not
        # currently ship — see the file header comment above. Non-blocking
        # until that lands, so it can't produce a false-red on every repo.
        if: steps.exempt.outputs.is-exempt == 'false'
        continue-on-error: true
        uses: scientific-python/action-towncrier-changelog@f9c7df9a9f8b55cb0c12d94d14b281e9bcd101c0 # v2.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_USERNAME: em-release-bot

      - name: Report exemption
        if: steps.exempt.outputs.is-exempt == 'true'
        run: |
          echo "Skipping changelog note requirement: ${{ steps.exempt.outputs.reason }}"
