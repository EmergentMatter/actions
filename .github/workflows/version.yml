name: Version

# Reusable workflow_call workflow — see CONTRACT.md "version.yml behaviour".
#
# Called on every push to `main` in a consuming repo, after that repo's own
# CI (the `needs: ci` edge in its stub — see templates/stub-version.yml).
#
# Two paths, chosen by whether HEAD is the release commit that a merged
# release PR just produced:
#
#   HEAD IS the release commit  -> push the tag, build, create the GitHub
#                                   Release, optionally publish. (S1/S2/S3/S4)
#   otherwise                   -> compute the bump; if there's a note
#                                   pending, draft/update the release PR.
#
# Build + release are INLINED into this job's tag path rather than left to
# a separately tag-triggered workflow (build-release.yml). Reason, found by
# the em-release-control-test rehearsal: the tag below is pushed using the
# checkout's persisted GITHUB_TOKEN credentials, and GitHub does not run
# further workflows from events created by GITHUB_TOKEN (the same
# recursion guard documented for the release PR's own checks) — so a
# `build-release.yml` stub listening for `push: tags: ["v*"]` would simply
# never fire on the automated path. `uses:` can't take a templated ref
# either, so this can't call build-release.yml as a nested reusable
# workflow with the actions-ref input below — the steps are inlined
# instead. build-release.yml still exists, retargeted at `workflow_dispatch`
# and human-pushed tags (which DO trigger workflows), for manually
# rebuilding/republishing a past release.
#
# Detecting "HEAD is the release commit": rather than parsing the merge
# commit message (which differs by merge strategy — merge commit, squash,
# or rebase all produce a different HEAD message), we ask the GitHub API
# which merged PR(s) contain this commit and check whether any of them has
# `release-branch` as its head ref. That's strategy-agnostic and doesn't
# depend on peter-evans/create-pull-request's exact commit/PR-title text.
#
# scripts/compute_bump.py and scripts/sync_version.py live in THIS repo,
# not the consumer's — a called reusable workflow only checks out the
# CALLER's code by default, so we check out EmergentMatter/actions a
# second time, pinned to job.workflow_sha (the exact commit SHA of THIS
# reusable workflow file — see the checkout step below for why, not
# github.workflow_ref, which resolves to the CALLER's ref), into
# .em-actions/, and invoke the scripts from there against the consumer's
# checked-out pyproject.toml / changelog.d/.

on:
  workflow_call:
    inputs:
      actions-ref:
        description: >-
          Ref of EmergentMatter/actions to load scripts/ from. MUST match the
          @ref this workflow is pinned to in your stub. There is no context
          field giving a reusable workflow its own ref (github.job_workflow_sha
          resolves to empty -- verified, not assumed), and an empty checkout ref
          silently means "the default branch", so this is passed explicitly
          rather than derived.
        type: string
        default: v1
      release-branch:
        description: Fixed branch the release PR is opened from. Force-updated every run.
        type: string
        default: release/next
      notes-dir:
        description: Directory containing pending changelog note fragments.
        type: string
        default: changelog.d
      python-version:
        description: Python version used to run compute_bump.py / sync_version.py.
        type: string
        default: "3.13"
      uv-version:
        description: Exact uv version to install (never "latest" — uv version --bump needs >=0.7).
        type: string
        default: "0.12.5"
      skip-label:
        description: >-
          Label applied to the release PR so it exempts its own note check (E6).
          Must match whatever the repo passes as changelog-check.yml's skip-label
          input — a repo that overrides one and not the other breaks E6 silently.
          (Defense in depth only: the release PR is also authored by
          github-actions[bot], which changelog-check.yml's default bot-actors
          already exempts independently.)
        type: string
        default: skip-changelog
    
