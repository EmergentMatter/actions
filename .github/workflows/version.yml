name: Version

# Reusable workflow_call workflow — see CONTRACT.md "version.yml behaviour".
#
# Called on every push to `main` in a consuming repo, after that repo's own
# CI (the `needs: ci` edge in its stub — see templates/stub-version.yml).
#
# Two paths, chosen by whether HEAD is the release commit that a merged
# release PR just produced:
#
#   HEAD IS the release commit  -> push the tag, build, create the GitHub
#                                   Release, optionally publish. (S1/S2/S3/S4)
#   otherwise                   -> compute the bump; if there's a note
#                                   pending, draft/update the release PR.
#
# Build + release are INLINED into this job's tag path rather than left to
# a separately tag-triggered workflow (build-release.yml). Reason, found by
# the em-release-control-test rehearsal: the tag below is pushed using the
# checkout's persisted GITHUB_TOKEN credentials, and GitHub does not run
# further workflows from events created by GITHUB_TOKEN (the same
# recursion guard documented for the release PR's own checks) — so a
# `build-release.yml` stub listening for `push: tags: ["v*"]` would simply
# never fire on the automated path. `uses:` can't take a templated ref
# either, so this can't call build-release.yml as a nested reusable
# workflow with the actions-ref input below — the steps are inlined
# instead. build-release.yml still exists, retargeted at `workflow_dispatch`
# and human-pushed tags (which DO trigger workflows), for manually
# rebuilding/republishing a past release.
#
# Detecting "HEAD is the release commit": rather than parsing the merge
# commit message (which differs by merge strategy — merge commit, squash,
# or rebase all produce a different HEAD message), we ask the GitHub API
# which merged PR(s) contain this commit and check whether any of them has
# `release-branch` as its head ref. That's strategy-agnostic and doesn't
# depend on peter-evans/create-pull-request's exact commit/PR-title text.
#
# scripts/compute_bump.py and scripts/sync_version.py live in THIS repo,
# not the consumer's — a called reusable workflow only checks out the
# CALLER's code by default, so we check out EmergentMatter/actions a
# second time, pinned to job.workflow_sha (the exact commit SHA of THIS
# reusable workflow file — see the checkout step below for why, not
# github.workflow_ref, which resolves to the CALLER's ref), into
# .em-actions/, and invoke the scripts from there against the consumer's
# checked-out pyproject.toml / changelog.d/.

on:
  workflow_call:
    inputs:
      actions-ref:
        description: >-
          Ref of EmergentMatter/actions to load scripts/ from. MUST match the
          @ref this workflow is pinned to in your stub. There is no context
          field giving a reusable workflow its own ref (github.job_workflow_sha
          resolves to empty -- verified, not assumed), and an empty checkout ref
          silently means "the default branch", so this is passed explicitly
          rather than derived.
        type: string
        default: v1
      release-branch:
        description: Fixed branch the release PR is opened from. Force-updated every run.
        type: string
        default: release/next
      notes-dir:
        description: Directory containing pending changelog note fragments.
        type: string
        default: changelog.d
      python-version:
        description: Python version used to run compute_bump.py / sync_version.py.
        type: string
        default: "3.13"
      uv-version:
        description: Exact uv version to install (never "latest" — uv version --bump needs >=0.7).
        type: string
        default: "0.12.5"
      skip-label:
        description: >-
          Label applied to the release PR so it exempts its own note check (E6).
          Must match whatever the repo passes as changelog-check.yml's skip-label
          input — a repo that overrides one and not the other breaks E6 silently.
          (Defense in depth only: the release PR is also authored by
          github-actions[bot], which changelog-check.yml's default bot-actors
          already exempts independently.)
        type: string
        default: skip-changelog
      publish:
        description: Publish to a package index via OIDC trusted publishing. Opt-in, off by default. (S3)
        type: boolean
        default: false
      environment:
        description: >-
          GitHub Environment to run the publish job under (e.g. for required
          reviewers). Only consulted when publish is true, but it's still
          used to name the environment even when publish is false: GitHub
          validates `environment:` at workflow-PARSE time, before any `if:`
          is evaluated, and an empty environment name is invalid there — so
          an empty default doesn't get skipped by the publish gate, it
          fails the whole workflow to load, for every run, including ones
          that never touch publishing. Found live in the rehearsal
          (startup_failure, no jobs ran at all). A repo enabling
          `publish: true` must create a GitHub Environment with this name
          and attach its PyPI trusted publisher to it.
        type: string
        default: release

      # ── Private sibling checkout ──────────────────────────────────────
      #
      # For a consumer whose pyproject.toml pins a dependency as a LOCAL PATH
      # source (`[tool.uv.sources] foo = { path = "../foo" }`), because that
      # dependency isn't on an index yet. Its own ci.yml can check the sibling
      # out, but this workflow is called by reference and can't be given
      # steps -- and the bump step below runs `uv version --bump` and
      # `uv lock`, both of which resolve path sources and fail without it:
      #
      #   error: Distribution not found at: file:///.../foo
      #
      # Unset, every sibling step below is skipped and a consumer with no path
      # sources is unaffected. The block comes out when the dependency ships
      # to an index. See docs/onboarding.md for the consumer-side walkthrough.
      sibling-repo:
        description: >-
          owner/name of a private repo to check out alongside the consumer's
          checkout. Empty (the default) disables the sibling checkout.
        type: string
        default: ""
      sibling-ref:
        description: >-
          Exact ref of sibling-repo. Required when sibling-repo is set, and
          validated below rather than defaulted -- an empty checkout ref
          silently means "the default branch". Pin a SHA: the consumer's
          uv.lock embeds the sibling's resolved version, so a floating ref
          turns any merge into the sibling into a red run in the consumer.
        type: string
        default: ""
      sibling-path:
        description: >-
          Directory the sibling lands in, as a SINGLE path segment. Must match
          the consumer's path source: `{ path = "../foo" }` means `foo`.
        type: string
        default: ""

    secrets:
      sibling-token:
        description: >-
          Token used to read sibling-repo, needed when it is private --
          `github.token` cannot read a DIFFERENT private repo, so a
          fine-grained PAT scoped to that one repo is the intended value.
          Optional; a public sibling falls back to `github.token`.

          Map it by name (`secrets: { sibling-token: ... }`), never via
          `secrets: inherit` -- this workflow is public and pinned by a
          MOVABLE `v1` tag, so inheriting would make that tag equivalent to
          org-wide secret access in every consuming repo.
        required: false

permissions: {}

concurrency:
  group: version-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute release / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      is-release-commit: ${{ steps.detect.outputs.is-release-commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate the shared-workflow ref
        # Resolve which commit of EmergentMatter/actions to load scripts/ from.
        #
        # Preferred: job.workflow_sha -- the commit of the reusable workflow
        # file running this job (actions/runner#4335). Exact, and it cannot
        # drift from the @ref the consumer pinned, because it IS that commit.
        # Fallback: the actions-ref input, for runners predating that property.
        #
        # This is asserted rather than passed straight to checkout because an
        # unresolvable ref evaluates to an EMPTY STRING and checkout treats an
        # empty ref as "the default branch" -- it would quietly run main while
        # the consumer believes it pinned @v1. Two earlier derivations failed
        # exactly that way in the rehearsal: github.workflow_ref is the
        # CALLER's ref, and github.job_workflow_sha does not exist.
        id: shared
        env:
          SHA: ${{ job.workflow_sha }}
          REF: ${{ inputs.actions-ref }}
        run: |
          set -euo pipefail
          if [[ "${SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved from job.workflow_sha: ${SHA}"
            echo "ref=${SHA}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${REF:-}" ]]; then
            echo "::notice::job.workflow_sha unavailable ('${SHA:-<empty>}'); falling back to actions-ref='${REF}'."
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cannot resolve the EmergentMatter/actions commit: job.workflow_sha"
            echo "is empty and actions-ref is unset. Refusing to continue, because an empty"
            echo "checkout ref silently means the default branch and would ignore your pin."
            exit 1
          fi

      - name: Checkout EmergentMatter/actions scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EmergentMatter/actions
          ref: ${{ steps.shared.outputs.ref }}
          path: .em-actions

      # ---------------------------------------------------------------
      # Private sibling checkout -- see the sibling-* inputs for why.
      # All three steps no-op when sibling-repo is unset.
      # ---------------------------------------------------------------
      - name: Validate the sibling inputs
        if: inputs.sibling-repo != ''
        env:
          SIBLING_REF: ${{ inputs.sibling-ref }}
          SIBLING_PATH: ${{ inputs.sibling-path }}
        run: |
          set -euo pipefail
          # Checked BEFORE the checkout: an empty ref doesn't fail checkout, it
          # silently resolves to the sibling's default branch.
          if [ -z "${SIBLING_REF}" ]; then
            echo "::error::sibling-ref is required when sibling-repo is set — an empty ref silently means the sibling's default branch."
            exit 1
          fi
          # Becomes a destination OUTSIDE the workspace in the relocate step,
          # so it is constrained to one plain segment.
          case "${SIBLING_PATH}" in
            "" | */* | . | ..)
              echo "::error::sibling-path must be a single directory name with no slashes (got: '${SIBLING_PATH}')."
              exit 1
              ;;
          esac

      - name: Check out the private sibling
        if: inputs.sibling-repo != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.sibling-repo }}
          ref: ${{ inputs.sibling-ref }}
          # Falls back to github.token so a PUBLIC sibling needs no secret.
          token: ${{ secrets.sibling-token || github.token }}
          # One-shot clone -- no reason to leave the token in its git config.
          persist-credentials: false
          # Staged INSIDE the workspace: actions/checkout rejects a path that
          # escapes $GITHUB_WORKSPACE. The next step moves it out.
          path: .em-sibling/${{ inputs.sibling-path }}

      - name: Move the sibling alongside the consumer checkout
        if: inputs.sibling-repo != ''
        env:
          SIBLING_PATH: ${{ inputs.sibling-path }}
        run: |
          set -euo pipefail
          # `{ path = "../foo" }` resolves from the consumer's pyproject.toml
          # at $GITHUB_WORKSPACE, so the sibling belongs one level ABOVE it:
          #
          #   /home/runner/work/<repo>/            <- dirname, destination
          #   ├── <repo>/                          <- $GITHUB_WORKSPACE
          #   └── foo/                             <- the sibling
          #
          # actions/checkout can't write outside the workspace; a plain `run:`
          # step can, hence the stage-and-move.
          dest="$(dirname "${GITHUB_WORKSPACE}")/${SIBLING_PATH}"
          # A sibling-path equal to the consumer's OWN repo name puts dest on
          # $GITHUB_WORKSPACE, and the rm below would delete the checkout this
          # job is releasing from. Cheap assert, catastrophic miss.
          if [ "${dest}" = "${GITHUB_WORKSPACE}" ]; then
            echo "::error::sibling-path '${SIBLING_PATH}' resolves to the consumer checkout itself (${GITHUB_WORKSPACE})."
            exit 1
          fi
          rm -rf "${dest}"
          mv ".em-sibling/${SIBLING_PATH}" "${dest}"
          # .em-sibling must not survive: create-pull-request sweeps stray dirs
          # into the release PR as gitlinks -- the same bug the '.em-actions'
          # cleanup step below fixes. rmdir over rm -rf so it also asserts the
          # mv took everything.
          rmdir .em-sibling
          echo "sibling checked out at ${dest}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ inputs.uv-version }}

      # ---------------------------------------------------------------
      # S1: is HEAD the commit a merge of the release PR just produced?
      # ---------------------------------------------------------------
      - name: Detect release commit
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          set -euo pipefail
          # No `|| true` here: an empty result because no merged PR matches
          # is a normal, successful `gh api` exit (jq's select() just
          # yields nothing) and is handled correctly below. A real API
          # failure (rate limit, transient 5xx) must fail this step loudly
          # via set -e, not be swallowed into "not a release commit" — that
          # would silently skip tagging a just-merged release with a green
          # check and no error anywhere.
          refs=$(
            gh api "repos/${REPO}/commits/${SHA}/pulls" --paginate \
              -q '.[] | select(.merged_at != null) | .head.ref'
          )
          is_release_commit=false
          if grep -qxF "${RELEASE_BRANCH}" <<< "$refs"; then
            is_release_commit=true
          fi
          echo "is-release-commit=${is_release_commit}" >> "$GITHUB_OUTPUT"

      - name: Read released version
        if: steps.detect.outputs.is-release-commit == 'true'
        id: released
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: steps.detect.outputs.is-release-commit == 'true'
        id: tag
        env:
          VERSION: ${{ steps.released.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Note what follows this step still runs even if the tag already
          # existed (e.g. a retried run) -- build/release below are
          # idempotent, and skipping them here would mean a run that died
          # between tag-push and release-creation leaves a tag with no
          # Release attached forever.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — (re)building the release below anyway."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${tag}" "${SHA}"
            git push origin "${tag}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # S2: build the wheel/sdist and attach them to a GitHub Release for
      # the tag just pushed. Inlined here (via the shared composite action
      # below) rather than left to a tag-triggered workflow -- see the file
      # header for why a GITHUB_TOKEN-pushed tag can't rely on that.
      # Build + create the Release inline, in this same job.
      #
      # These steps are duplicated in build-release.yml, which covers the
      # human-pushed-tag / workflow_dispatch path. Keep the two in step.
      #
      # A shared composite action was tried and withdrawn. Be careful with the
      # history here: it was removed while chasing a startup_failure whose real
      # cause turned out to be elsewhere (the publish job requested a permission
      # the caller had not granted -- see that job). So the composite action was
      # NOT proven to be the problem and may well work. What is genuinely
      # awkward is the reference: `uses:` cannot take a templated ref, so
      # `EmergentMatter/actions/...@<ref>` could not follow the ref this
      # workflow is pinned at, and a local `./` path has to exist wherever the
      # runner resolves it from -- which for a reusable workflow called
      # cross-repo is not obvious and was never isolated on its own.
      #
      # Given that, the duplication is four steps, verified working end to end.
      # Revisit only with an isolated test of the `./` resolution question.
      #
      # These steps are therefore duplicated in build-release.yml, which serves
      # the human-pushed-tag / workflow_dispatch path. Keep the two in step.
      - name: Build wheel + sdist
        if: steps.detect.outputs.is-release-commit == 'true'
        run: uv build

      - name: Create the GitHub Release
        if: steps.detect.outputs.is-release-commit == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # Explicit globs, not dist/*: uv build writes a dist/.gitignore,
          # which the wildcard swept into the release as 'default.gitignore'
          # (GitHub renames assets beginning with a dot). Observed live.
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload build artifact for the publish job
        # Only needed when publish is actually enabled -- the publish job
        # runs on a separate, fresh runner and can't see this job's dist/.
        # Short retention: this bridges the two jobs within one run, it is
        # not meant as a long-lived download -- the GitHub Release above is
        # the permanent artifact.
        if: steps.detect.outputs.is-release-commit == 'true' && inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          retention-days: 1
          if-no-files-found: error

      # ---------------------------------------------------------------
      # Not the release commit: compute the bump from pending notes.
      # ---------------------------------------------------------------
      - name: Compute next version
        if: steps.detect.outputs.is-release-commit == 'false'
        id: bump
        run: |
          python3 ".em-actions/scripts/compute_bump.py" \
            --notes-dir "${{ inputs.notes-dir }}" \
            --format github

      - name: Bump [project] version and refresh the lockfile
        # V4 self-consistency: both files, one step, one eventual commit.
        if: >-
          steps.detect.outputs.is-release-commit == 'false' &&
          steps.bump.outputs.level != 'none'
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
          EXPECTED_NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          uv version --bump "${LEVEL}"
          uv lock
          actual=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${actual}" != "${EXPECTED_NEXT}" ]; then
            echo "::error::uv computed version ${actual} but compute_bump.py expected ${EXPECTED_NEXT} — semver bump semantics have diverged between uv and compute_bump.py's V2 rule (no 0.x special-casing)."
            exit 1
          fi

      - name: Sync declared version strings
        if: >-
          steps.detect.outputs.is-release-commit == 'false' &&
          steps.bump.outputs.level != 'none'
        run: |
          python3 ".em-actions/scripts/sync_version.py" --version "${{ steps.bump.outputs.next }}"

      - name: Build CHANGELOG.md and consume notes
        # A7: towncrier writes the changelog and deletes the fragments it
        # consumed in this same working-tree change, so both land in the
        # one commit the PR step below creates.
        if: >-
          steps.detect.outputs.is-release-commit == 'false' &&
          steps.bump.outputs.level != 'none'
        run: |
          uvx towncrier build --yes --version "${{ steps.bump.outputs.next }}"

      - name: Collect this release's changelog entries
        # For the release PR body, so a reviewer can see what they are
        # releasing without opening the diff.
        #
        # Read back out of CHANGELOG.md rather than out of changelog.d/:
        # towncrier has already consumed and deleted those notes by this
        # point, and reading the built file guarantees the PR says exactly
        # what the changelog says rather than a second rendering of it.
        id: notes
        if: >-
          steps.detect.outputs.is-release-commit == 'false' &&
          steps.bump.outputs.level != 'none'
        env:
          VERSION: ${{ steps.bump.outputs.next }}
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import os
          import re

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()

          # towncrier writes `## <version> (<date>)` with entries grouped under
          # `### Major` / `### Minor` / `### Patch`. Match that heading through
          # to the next `## `, which is the previous release. Keyed on the
          # version rather than on position or on the start marker, so it holds
          # whether towncrier inserted at the marker or prepended.
          match = re.search(
              rf"^## {re.escape(version)}[ (].*?(?=^## |\Z)", text, re.M | re.S
          )
          section = match.group(0).strip() if match else ""
          # Drop towncrier's own version heading; the PR title already says it.
          section = re.sub(r"^## .*\n", "", section, count=1).strip()

          if not section:
              # Never silently emit an empty section: a release PR listing no
              # changes looks like there are none, rather than like a bug here.
              section = (
                  f"Could not read the `{version}` section out of CHANGELOG.md. "
                  "See the diff on this PR for what is being released."
              )

          print("section<<CHANGELOG_SECTION_EOF")
          print(section)
          print("CHANGELOG_SECTION_EOF")
          PYEOF

      - name: Remove the shared checkout before staging the PR
        # actions/checkout refuses a path outside the workspace, so .em-actions
        # necessarily lands inside the consumer's tree -- where create-pull-request
        # would otherwise sweep it into the release PR as a gitlink. Observed
        # live in the rehearsal: the first release PR carried a stray
        # '.em-actions -> Subproject commit ...' entry. R3 says that PR contains
        # the version bumps, the changelog, the consumed notes and the lockfile,
        # and nothing else.
        if: >-
          steps.detect.outputs.is-release-commit == 'false' &&
          steps.bump.outputs.level != 'none'
        run: rm -rf .em-actions

      - name: Open or update the release PR
        if: >-
          steps.detect.outputs.is-release-commit == 'false' &&
          steps.bump.outputs.level != 'none'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: ${{ inputs.release-branch }}
          base: main
          delete-branch: false
          commit-message: "release: v${{ steps.bump.outputs.next }}"
          title: "Release v${{ steps.bump.outputs.next }}"
          # R3: this PR must contain only the version bump, changelog
          # update, note deletions, and lockfile refresh — nothing else ran
          # in this job before this step, so the working tree diff already
          # satisfies that; nothing extra is added here.
          # Follows the repo's own pull request template, minus the sections
          # that cannot apply to an automated PR: there is no linked issue,
          # and the checklist asks the reviewer to check the release rather
          # than asking the author to check their own work.
          body: |
            ## What changed and why

            Version bump to `v${{ steps.bump.outputs.next }}`, computed from
            the ${{ steps.bump.outputs.count }} pending changelog note(s).

            Merging this is the release: it pushes tag
            `v${{ steps.bump.outputs.next }}` and, in that same run, builds
            the wheel/sdist and creates the GitHub Release.

            ### In this release

            ${{ steps.notes.outputs.section }}

            ## How was this tested?

            Every change listed above was gated by the checks on `main`
            before this PR was drafted, which is where the testing happens.
            This PR itself adds no code: only the version bump, the
            `CHANGELOG.md` update, the consumed note deletions, and the
            refreshed `uv.lock`.

            If the checks below show as not run, close this PR and
            immediately reopen it. See `CONTRIBUTING.md` for why.

            ## Checklist

            - [ ] The entries above read correctly to someone who did not write them
            - [ ] `v${{ steps.bump.outputs.next }}` is the right version for those changes
          # E6: exempts this PR from changelog-check.yml's note requirement
          # by label. It's also opened as github-actions[bot], which
          # changelog-check.yml's default bot-actors already exempts (E5) —
          # this label is defense in depth, not the only path. The caller
          # must pass the same value here as it passes to
          # changelog-check.yml's skip-label input, or E6 breaks silently
          # for a repo that overrides one and not the other.
          labels: ${{ inputs.skip-label }}

  publish:
    name: Publish to package index
    needs: version
    if: needs.version.outputs.is-release-commit == 'true' && inputs.publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # NO `permissions:` block here, and that is load-bearing.
    #
    # A caller's `permissions:` on a `workflow_call` is a CEILING for every job
    # in the called workflow. Declaring `id-token: write` here therefore does
    # not merely fail to take effect when the caller hasn't granted it -- it
    # fails the ENTIRE workflow at parse time with startup_failure, on every
    # run, for every repo, including ones with publishing switched off and this
    # job skipped. Observed live: every run failed until this block was removed.
    #
    # So the permission has to come from the consumer's stub instead. A repo
    # enabling `publish: true` adds `id-token: write` to the `permissions:` on
    # its version.yml stub; this job then inherits it. A repo not publishing
    # grants nothing extra and this job never runs.
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
