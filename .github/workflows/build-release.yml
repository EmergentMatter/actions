name: Build & Release

# Reusable workflow_call workflow — see CONTRACT.md "version.yml behaviour"
# closing paragraph (S2/S3/S4).
#
# NOT the automated release path — version.yml builds and creates the
# GitHub Release itself, inline, in the same run that pushes the release
# tag, because a tag pushed with GITHUB_TOKEN does not trigger further
# workflow runs (found by the em-release-control-test rehearsal; see the
# comment at the top of version.yml). This workflow exists for the two
# cases that aren't that automated path: a human pushing a `v*` tag by
# hand, and templates/stub-build-release.yml's `workflow_dispatch` trigger
# for manually rebuilding or republishing a past release.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to build the package.
        type: string
        default: "3.13"
      uv-version:
        description: Exact uv version to install (never "latest").
        type: string
        default: "0.12.5"
      publish:
        description: Publish to a package index via OIDC trusted publishing. Opt-in, off by default.
        type: boolean
        default: false
      environment:
        description: GitHub Environment to run the publish job under (e.g. for required reviewers). Empty means none.
        type: string
        default: ""
      retention-days:
        description: Retention for the uploaded wheel/sdist artifact.
        type: number
        default: 90

permissions: {}

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ inputs.uv-version }}

      - name: Build
        run: uv build

      - name: Upload build artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: dist/*
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  publish:
    name: Publish to package index
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      # OIDC trusted publishing — no token, no long-lived secret. (S4)
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
